version: "3.8"

services:
  figma-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: figma-mcp-server
    restart: unless-stopped
    ports:
      - "3000:3000"   # MCP Streamable HTTP / SSE endpoint
      - "3055:3055"   # Figma Companion Plugin WebSocket bridge
    environment:
      - MCP_TRANSPORT=sse
      - PORT=3000
      - FIGMA_BRIDGE_PORT=3055
      - FIGMA_ACCESS_TOKEN=${FIGMA_ACCESS_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
