<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Figma MCP Bridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      line-height: 1.4;
      color: #333333;
      background: #ffffff;
      padding: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e5e5;
    }
    .title {
      font-weight: 600;
      font-size: 12px;
      color: #111111;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 10px;
    }
    .status-badge.disconnected {
      background: #fee2e2;
      color: #b91c1c;
    }
    .status-badge.connecting {
      background: #fef3c7;
      color: #b45309;
    }
    .status-badge.connected {
      background: #dcfce7;
      color: #15803d;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .info-section {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 10px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .info-row:last-child {
      margin-bottom: 0;
    }
    .info-label {
      color: #64748b;
    }
    .info-val {
      font-weight: 500;
      color: #1e293b;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .log-title {
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    #log-container {
      height: 90px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      border-radius: 6px;
      padding: 6px 8px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-entry {
      margin-bottom: 2px;
    }
    .log-time {
      color: #64748b;
    }
    .log-success {
      color: #4ade80;
    }
    .log-err {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Figma MCP Bridge</span>
    <div id="status-badge" class="status-badge disconnected">
      <span class="dot"></span>
      <span id="status-text">Disconnected</span>
    </div>
  </div>

  <div class="info-section">
    <div class="info-row">
      <span class="info-label">WebSocket:</span>
      <span class="info-val" id="ws-url">ws://localhost:3055</span>
    </div>
    <div class="info-row">
      <span class="info-label">Document:</span>
      <span class="info-val" id="doc-name">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">Page:</span>
      <span class="info-val" id="page-name">-</span>
    </div>
  </div>

  <div class="log-title">Activity Log</div>
  <div id="log-container"></div>

  <script>
    const ENDPOINTS = ["ws://127.0.0.1:3055", "ws://localhost:3055"];
    let endpointIndex = 0;
    let ws = null;
    let reconnectTimeout = null;
    let isConnecting = false;
    let documentInfo = { fileName: "", currentPage: "" };

    const statusBadge = document.getElementById("status-badge");
    const statusText = document.getElementById("status-text");
    const docNameEl = document.getElementById("doc-name");
    const pageNameEl = document.getElementById("page-name");
    const logContainer = document.getElementById("log-container");

    function setStatus(status, text) {
      statusBadge.className = "status-badge " + status;
      statusText.textContent = text;
    }

    function addLog(message, type = "info") {
      const now = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      div.className = "log-entry";
      let typeClass = "";
      if (type === "success") typeClass = "log-success";
      if (type === "error") typeClass = "log-err";

      div.innerHTML = `<span class="log-time">[${now}]</span> <span class="${typeClass}">${message}</span>`;
      logContainer.appendChild(div);
      logContainer.scrollTop = logContainer.scrollHeight;
      // Keep activity log manageable
      while (logContainer.children.length > 50) {
        logContainer.removeChild(logContainer.firstChild);
      }
    }

    function connectWebSocket() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        return;
      }

      if (reconnectTimeout) {
        clearTimeout(reconnectTimeout);
        reconnectTimeout = null;
      }

      const currentUrl = ENDPOINTS[endpointIndex];
      document.getElementById("ws-url").textContent = currentUrl;
      setStatus("connecting", "Connecting...");

      try {
        isConnecting = true;
        const socket = new WebSocket(currentUrl);

        socket.onopen = () => {
          ws = socket;
          isConnecting = false;
          setStatus("connected", "Connected");
          addLog("Connected to MCP Server bridge", "success");

          // Sync document context immediately
          ws.send(JSON.stringify({
            type: "plugin_handshake",
            payload: documentInfo
          }));
        };

        socket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);

            // Handle server-side ping/pong frames
            if (data.type === "bridge_ping") {
              if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "bridge_pong", timestamp: Date.now() }));
              }
              return;
            }
            if (data.type === "bridge_pong") {
              return;
            }

            if (data && data.id && data.action) {
              addLog(`Cmd: ${data.action}`);
              // Forward request to Figma main thread (code.ts)
              parent.postMessage({
                pluginMessage: {
                  type: "mcp_request",
                  id: data.id,
                  action: data.action,
                  params: data.params || {}
                }
              }, "*");
            }
          } catch (err) {
            addLog("Err parsing message: " + err.message, "error");
          }
        };

        socket.onclose = () => {
          if (ws === socket) ws = null;
          isConnecting = false;
          setStatus("disconnected", "Disconnected");
          // Rotate between 127.0.0.1 and localhost
          endpointIndex = (endpointIndex + 1) % ENDPOINTS.length;
          scheduleReconnect(800);
        };

        socket.onerror = () => {
          // onError is followed by onClose automatically
        };
      } catch (err) {
        isConnecting = false;
        setStatus("disconnected", "Disconnected");
        endpointIndex = (endpointIndex + 1) % ENDPOINTS.length;
        scheduleReconnect(1000);
      }
    }

    function scheduleReconnect(delay = 1000) {
      if (!reconnectTimeout) {
        reconnectTimeout = setTimeout(() => {
          reconnectTimeout = null;
          connectWebSocket();
        }, delay);
      }
    }

    // ------------------------------------------------------------------------
    // UNTHROTTLED BACKGROUND HEARTBEAT WORKER
    // Web Workers run in an isolated thread and are NOT throttled by Chromium
    // when Figma is minimized, blurred, or running in the background.
    // ------------------------------------------------------------------------
    try {
      const workerBlob = new Blob([
        `setInterval(() => { postMessage("pulse"); }, 2500);`
      ], { type: "application/javascript" });
      const workerUrl = URL.createObjectURL(workerBlob);
      const bgWorker = new Worker(workerUrl);

      bgWorker.onmessage = () => {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          connectWebSocket();
        } else {
          try {
            ws.send(JSON.stringify({ type: "plugin_heartbeat", timestamp: Date.now() }));
          } catch (e) {
            connectWebSocket();
          }
        }
      };
    } catch (e) {
      // Fallback timer if Web Workers are restricted in environment
      setInterval(() => {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          connectWebSocket();
        } else {
          try {
            ws.send(JSON.stringify({ type: "plugin_heartbeat", timestamp: Date.now() }));
          } catch (err) {}
        }
      }, 2500);
    }

    // Immediate reconnect triggers
    window.addEventListener("focus", () => connectWebSocket());
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") connectWebSocket();
    });

    // Listen for messages from Figma sandbox (code.ts)
    window.onmessage = (event) => {
      const msg = event.data?.pluginMessage;
      if (!msg) return;

      if (msg.type === "plugin_handshake") {
        documentInfo = msg.payload;
        docNameEl.textContent = documentInfo.fileName || "Untitled";
        pageNameEl.textContent = documentInfo.currentPage || "Page 1";

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: "status_update",
            payload: documentInfo
          }));
        }
      } else if (msg.type === "mcp_response") {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            id: msg.id,
            success: msg.success,
            data: msg.data,
            error: msg.error
          }));
          if (msg.success) {
            addLog(`Done: ${msg.id.slice(0, 6)}`, "success");
          } else {
            addLog(`Failed: ${msg.error}`, "error");
          }
        }
      }
    };

    // Initial connection attempt
    connectWebSocket();
  </script>
</body>
</html>
